name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: live, POSTGRES_PASSWORD: live, POSTGRES_DB: arrematto_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U live" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://live:live@localhost:5432/arrematto_test
      TEST_DATABASE_URL: postgresql://live:live@localhost:5432/arrematto_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @arrematto/api exec drizzle-kit migrate
      - run: pnpm -r test
